name: Add issues to ianseo project

on:
  issues:
    types:
      - unlabeled

jobs:
  add-to-project:
    if: ${{ contains(github.event.*.labels.*.name, 'triage') }}
    name: Add issue to project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/add-to-project@main
        with:
          # You can target a project in a different organization
          # to the issue
          project-url: https://github.com/orgs/artfulbodger/projects/1
          github-token: ${{ secrets.PAT }}